spring.datasource.url=jdbc:postgresql://localhost:5432/identity_db
spring.datasource.username=ainvest
spring.datasource.password=${DB_PASSWORD:ainvest_dev_pw}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET:dev-only-secret-key-for-ainvest-identity-service-change-in-production-1234567890}
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

server.port=8081
spring.application.name=identity-service

# every log line also goes to logs/identity.log as one JSON object (Elastic Common Schema), ready for a SIEM;
# the console keeps the readable text format
logging.file.name=logs/identity.log
logging.structured.format.file=ecs

# behind the gateway the real client IP comes from X-Forwarded-For. "native" lets Tomcat use that header only when
# the request arrives from a trusted internal address (the gateway on this machine), so a client cannot fake its IP
server.forward-headers-strategy=native
