# Alembic = the service's schema migrations (same role as EF Core migrations in the .NET services).
#   new migration:   .\venv\Scripts\python.exe -m alembic revision --autogenerate -m "add_xyz"   (then READ the file)
#   apply:           .\venv\Scripts\python.exe -m alembic upgrade head
# The connection string is not here: migrations/env.py takes it from PORTFOLIO_DATABASE_URL (.env)
[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
