<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kitap kuralları</title><style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16181d;--muted:#667085;--grid:#e3e6eb;--motive:#2a6fd6;--corr:#8a93a3;
--bad:#c62828;--good:#1b7f3b;--guide:#9a6200}
@media (prefers-color-scheme:dark){:root{--bg:#111317;--card:#1a1d23;--ink:#eceff4;--muted:#9aa4b2;--grid:#2c313a;
--motive:#6aa5f8;--corr:#8d97a6;--bad:#ff7b72;--good:#56c271;--guide:#e3a94a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:1240px;margin:0 auto;padding:24px 16px 64px}h1{font-size:26px;margin:0 0 4px}h2{font-size:19px;margin:34px 0 10px}
p{max-width:78ch}.lead{color:var(--muted);margin:0 0 8px}.note{margin:6px 0 0;font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(370px,100%),1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--grid);border-radius:8px;padding:12px 14px;margin:0}
.card h3{font-size:15px;margin:0 0 2px}.card svg{width:100%;height:auto;display:block}
.v{font-weight:600}.v.bad{color:var(--bad)}.v.good{color:var(--good)}
ul{margin:6px 0 0;padding-left:18px;font-size:13.5px}li.unknown,li.ok{color:var(--muted)}
li.violation{color:var(--bad)}li.guide{color:var(--guide)}
.prices{font:12.5px ui-monospace,Consolas,monospace;color:var(--muted)}
svg text{fill:var(--ink);font:600 13px system-ui,"Segoe UI",sans-serif;paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}svg tspan.p{fill:var(--muted);font-weight:400;font-size:11px}
svg text.lim{fill:var(--bad);font-size:11px}svg text.gl{fill:var(--guide);font-size:11px}
.m{stroke:var(--motive);stroke-width:2.2}.c{stroke:var(--corr);stroke-width:2.2}
.sub{stroke:var(--muted);stroke-width:1.3;fill:none}.dash{stroke:var(--bad);stroke-width:1.3;stroke-dasharray:5 4}
.dashg{stroke:var(--guide);stroke-width:1.3;stroke-dasharray:5 4}.chan{stroke:var(--good);stroke-width:1.2;stroke-dasharray:3 3}
.dot{fill:var(--ink)}.dotbad{fill:var(--bad)}

.cu{stroke:var(--good);fill:var(--good)}.cd{stroke:var(--bad);fill:var(--bad)}.wide{grid-column:1/-1}
.lblue{stroke:var(--motive);stroke-width:1.8}.lred{stroke:var(--bad);stroke-width:1.6}.lgreen{stroke:var(--good);stroke-width:1.6}
.lamber{stroke:var(--guide);stroke-width:1.6}.lgray{stroke:var(--corr);stroke-width:1.2;stroke-dasharray:4 3}
.zgreen{fill:var(--good);opacity:.14}.zred{fill:var(--bad);opacity:.14}.zblue{fill:var(--motive);opacity:.14}
svg text.t{font-size:11.5px}svg text.ax{font-size:10.5px;font-weight:400;fill:var(--muted)}
</style></head><body><main><h1>Kitap kuralları</h1><p class="lead">Kitaplardan çıkan kurallar (book data). Numaralar BOOKS.md'deki kurallardır; kitapların metni ya da görselleri kopyalanmadı.</p><h2>1. Kural çizimleri (kendi sayılarımız)</h2><div class="grid"><figure class="card"><h3>VWAP iki yarıya böler (BK-02…05)</h3><svg viewBox="0 0 380 230" role="img" aria-label="80 92 83 96 88 110 100 85"><line class="dashg" x1="6" x2="374" y1="198.0" y2="198.0"/><text class="gl" x="374" y="194.0" text-anchor="end">VWAP</text><line class="dash" x1="6" x2="374" y1="135.8" y2="135.8"/><text class="lim" x="374" y="131.8" text-anchor="end">+1 sapma</text><line class="m" x1="46.0" y1="187.6" x2="87.1" y2="125.4"/><line class="c" x1="87.1" y1="125.4" x2="128.3" y2="172.1"/><line class="m" x1="128.3" y1="172.1" x2="169.4" y2="104.6"/><line class="c" x1="169.4" y1="104.6" x2="210.6" y2="146.1"/><line class="m" x1="210.6" y1="146.1" x2="251.7" y2="32.0"/><line class="c" x1="251.7" y1="32.0" x2="292.9" y2="83.9"/><line class="m" x1="292.9" y1="83.9" x2="334.0" y2="161.7"/><circle class="dot" cx="46.0" cy="187.6" r="4"><title> 80</title></circle><text x="46.0" y="206.6" text-anchor="middle"> <tspan class="p">80</tspan></text><circle class="dot" cx="87.1" cy="125.4" r="4"><title> 92</title></circle><text x="87.1" y="116.4" text-anchor="middle"> <tspan class="p">92</tspan></text><circle class="dot" cx="128.3" cy="172.1" r="4"><title>dönüş 83</title></circle><text x="128.3" y="191.1" text-anchor="middle">dönüş <tspan class="p">83</tspan></text><circle class="dot" cx="169.4" cy="104.6" r="4"><title> 96</title></circle><text x="169.4" y="95.6" text-anchor="middle"> <tspan class="p">96</tspan></text><circle class="dot" cx="210.6" cy="146.1" r="4"><title> 88</title></circle><text x="210.6" y="165.1" text-anchor="middle"> <tspan class="p">88</tspan></text><circle class="dot" cx="251.7" cy="32.0" r="4"><title>uzak: dönüş aranır 110</title></circle><text x="251.7" y="23.0" text-anchor="middle">uzak: dönüş aranır <tspan class="p">110</tspan></text><circle class="dot" cx="292.9" cy="83.9" r="4"><title> 100</title></circle><text x="292.9" y="102.9" text-anchor="middle"> <tspan class="p">100</tspan></text><circle class="dot" cx="334.0" cy="161.7" r="4"><title>kâr al 85</title></circle><text x="334.0" y="180.7" text-anchor="middle">kâr al <tspan class="p">85</tspan></text></svg><div class="prices">80 → 92 → 83 → 96 → 88 → 110 → 100 → 85</div><p class="note">VWAP üstünde long, altında short aranır; VWAP'a yakınken işlem yok, kesişim işlemi yok. Uzakta (≥ 1 sapma) VWAP'a dönüş işlemi: hedef VWAP'a varmadan, en az 2R yer olmalı.</p></figure><figure class="card"><h3>Kırılım hacmi (BK-25)</h3><svg viewBox="0 0 380 230" role="img" aria-label="70 89 78 90 80 98 91 108"><line class="dash" x1="6" x2="374" y1="110.6" y2="110.6"/><text class="lim" x="374" y="106.6" text-anchor="end">direnç</text><line class="m" x1="46.0" y1="198.0" x2="87.1" y2="115.0"/><line class="c" x1="87.1" y1="115.0" x2="128.3" y2="163.1"/><line class="m" x1="128.3" y1="163.1" x2="169.4" y2="110.6"/><line class="c" x1="169.4" y1="110.6" x2="210.6" y2="154.3"/><line class="m" x1="210.6" y1="154.3" x2="251.7" y2="75.7"/><line class="c" x1="251.7" y1="75.7" x2="292.9" y2="106.3"/><line class="m" x1="292.9" y1="106.3" x2="334.0" y2="32.0"/><circle class="dot" cx="46.0" cy="198.0" r="4"><title> 70</title></circle><text x="46.0" y="217.0" text-anchor="middle"> <tspan class="p">70</tspan></text><circle class="dot" cx="87.1" cy="115.0" r="4"><title> 89</title></circle><text x="87.1" y="106.0" text-anchor="middle"> <tspan class="p">89</tspan></text><circle class="dot" cx="128.3" cy="163.1" r="4"><title> 78</title></circle><text x="128.3" y="182.1" text-anchor="middle"> <tspan class="p">78</tspan></text><circle class="dot" cx="169.4" cy="110.6" r="4"><title> 90</title></circle><text x="169.4" y="101.6" text-anchor="middle"> <tspan class="p">90</tspan></text><circle class="dot" cx="210.6" cy="154.3" r="4"><titl
