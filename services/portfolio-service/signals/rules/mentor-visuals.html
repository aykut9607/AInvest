<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mentor bakışı kural görselleri</title><style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16181d;--muted:#667085;--grid:#e3e6eb;--motive:#2a6fd6;--corr:#8a93a3;
--bad:#c62828;--good:#1b7f3b;--guide:#9a6200}
@media (prefers-color-scheme:dark){:root{--bg:#111317;--card:#1a1d23;--ink:#eceff4;--muted:#9aa4b2;--grid:#2c313a;
--motive:#6aa5f8;--corr:#8d97a6;--bad:#ff7b72;--good:#56c271;--guide:#e3a94a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,"Segoe UI",sans-serif}
main{max-width:1240px;margin:0 auto;padding:24px 16px 64px}h1{font-size:26px;margin:0 0 4px}h2{font-size:19px;margin:34px 0 10px}
p{max-width:78ch}.lead{color:var(--muted);margin:0 0 8px}.note{margin:6px 0 0;font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(370px,100%),1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--grid);border-radius:8px;padding:12px 14px;margin:0}
.card h3{font-size:15px;margin:0 0 2px}.card svg{width:100%;height:auto;display:block}
.v{font-weight:600}.v.bad{color:var(--bad)}.v.good{color:var(--good)}
ul{margin:6px 0 0;padding-left:18px;font-size:13.5px}li.unknown,li.ok{color:var(--muted)}
li.violation{color:var(--bad)}li.guide{color:var(--guide)}
.prices{font:12.5px ui-monospace,Consolas,monospace;color:var(--muted)}
svg text{fill:var(--ink);font:600 13px system-ui,"Segoe UI",sans-serif;paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}svg tspan.p{fill:var(--muted);font-weight:400;font-size:11px}
svg text.lim{fill:var(--bad);font-size:11px}svg text.gl{fill:var(--guide);font-size:11px}
.m{stroke:var(--motive);stroke-width:2.2}.c{stroke:var(--corr);stroke-width:2.2}
.sub{stroke:var(--muted);stroke-width:1.3;fill:none}.dash{stroke:var(--bad);stroke-width:1.3;stroke-dasharray:5 4}
.dashg{stroke:var(--guide);stroke-width:1.3;stroke-dasharray:5 4}.chan{stroke:var(--good);stroke-width:1.2;stroke-dasharray:3 3}
.dot{fill:var(--ink)}.dotbad{fill:var(--bad)}

.cu{stroke:var(--good);fill:var(--good)}.cd{stroke:var(--bad);fill:var(--bad)}.wide{grid-column:1/-1}
.lblue{stroke:var(--motive);stroke-width:1.8}.lred{stroke:var(--bad);stroke-width:1.6}.lgreen{stroke:var(--good);stroke-width:1.6}
.lamber{stroke:var(--guide);stroke-width:1.6}.lgray{stroke:var(--corr);stroke-width:1.2;stroke-dasharray:4 3}
.zgreen{fill:var(--good);opacity:.14}.zred{fill:var(--bad);opacity:.14}.zblue{fill:var(--motive);opacity:.14}
svg text.t{font-size:11.5px}svg text.ax{font-size:10.5px;font-weight:400;fill:var(--muted)}
</style></head><body><main><h1>Mentor bakışı kural görselleri</h1><p class="lead">Sözlük, gösterge paneli ve mentor videolarından çıkan kurallar. Numaralar MENTOR_VIEW.md'deki kurallardır. Örnekler en yeni olana göre seçildi.</p><h2>1. Kural çizimleri (kendi sayılarımız)</h2><div class="grid"><figure class="card"><h3>Gerçek kırılım ve sahte kırılım (MB-01)</h3><svg viewBox="0 0 440 270" role="img"><line x1="8" x2="366" y1="244.0" y2="244.0" style="stroke:var(--grid)"/><text class="ax" x="371" y="248.0">48</text><line x1="8" x2="366" y1="187.0" y2="187.0" style="stroke:var(--grid)"/><text class="ax" x="371" y="191.0">53</text><line x1="8" x2="366" y1="130.0" y2="130.0" style="stroke:var(--grid)"/><text class="ax" x="371" y="134.0">57</text><line x1="8" x2="366" y1="73.0" y2="73.0" style="stroke:var(--grid)"/><text class="ax" x="371" y="77.0">61</text><line x1="8" x2="366" y1="16.0" y2="16.0" style="stroke:var(--grid)"/><text class="ax" x="371" y="20.0">66</text><g class="cu"><line x1="37.8" x2="37.8" y1="117.3" y2="231.8"/><rect x="19.3" y="130.0" width="37.0" height="89.1"/></g><g class="cd"><line x1="97.5" x2="97.5" y1="91.8" y2="168.2"/><rect x="79.0" y="130.0" width="37.0" height="25.4"/></g><g class="cu"><line x1="157.2" x2="157.2" y1="66.4" y2="168.2"/><rect x="138.7" y="117.3" width="37.0" height="38.2"/></g><g class="cd"><line x1="216.8" x2="216.8" y1="104.6" y2="180.9"/><rect x="198.3" y="117.3" width="37.0" height="50.9"/></g><g class="cu"><line x1="276.5" x2="276.5" y1="40.9" y2="174.5"/><rect x="258.0" y="53.7" width="37.0" height="114.5"/></g><g class="cu"><line x1="336.2" x2="336.2" y1="28.2" y2="91.8"/><rect x="317.7" y="40.9" width="37.0" height="12.7"/></g><line class="lred" x1="97.5" y1="91.8" x2="336.2" y2="91.8"/><circle class="dot" cx="157.2" cy="66.4" r="2.6"/><text class="t" x="157.2" y="58.4" text-anchor="middle">fitil: sahte</text><circle class="dot" cx="276.5" cy="40.9" r="2.6"/><text class="t" x="276.5" y="32.9" text-anchor="middle">gövde: gerçek</text></svg><p class="note">Çizgi önceki tepenin <b>fitil ucundan</b>. Yeni mumun <b>gövdesi</b> keserse (üstünde kapanırsa) kırılım; yalnız fitil keserse sahte / sweep.</p></figure><figure class="card"><h3>MSB ve CHoCH (MB-02)</h3><svg viewBox="0 0 380 230" role="img" aria-label="100 78 90 66 76 70 82 74 94"><line class="dash" x1="6" x2="374" y1="80.8" y2="80.8"/><text class="lim" x="374" y="76.8" text-anchor="end">kırılırsa MSB</text><line class="dashg" x1="6" x2="374" y1="149.2" y2="149.2"/><text class="gl" x="374" y="145.2" text-anchor="end">kırılırsa CHoCH</text><line class="m" x1="46.0" y1="32.0" x2="82.0" y2="139.4"/><line class="c" x1="82.0" y1="139.4" x2="118.0" y2="80.8"/><line class="m" x1="118.0" y1="80.8" x2="154.0" y2="198.0"/><line class="c" x1="154.0" y1="198.0" x2="190.0" y2="149.2"/><line class="m" x1="190.0" y1="149.2" x2="226.0" y2="178.5"/><line class="c" x1="226.0" y1="178.5" x2="262.0" y2="119.9"/><line class="m" x1="262.0" y1="119.9" x2="298.0" y2="158.9"/><line class="c" x1="298.0" y1="158.9" x2="334.0" y2="61.3"/><circle class="dot" cx="46.0" cy="32.0" r="4"><title> 100</title></circle><text x="46.0" y="23.0" text-anchor="middle"> <tspan class="p">100</tspan></text><circle class="dot" cx="82.0" cy="139.4" r="4"><title> 78</title></circle><text x="82.0" y="158.4" text-anchor="middle"> <tspan class="p">78</tspan></text><circle class="dot" cx="118.0" cy="80.8" r="4"><title>büyük LH 90</title></circle><text x="118.0" y="71.8" text-anchor="middle">büyük LH <tspan class="p">90</tspan></text><circle class="dot" cx="154.0" cy="198.0" r="4"><title>LL 66</title></circle><text x="154.0" y="217.0" text-anchor="middle">LL <tspan class="p">66</tspan></text><circle class="dot" cx="190.0" cy="149.2" r="4"><title>küçük LH 76</title></circle><text x="190.0" y="140.2" text-anchor="middle">küçük LH <tspan class="p">76</tspan></text><circle class="dot" cx="226.0" cy="178.5" r="4"><title> 70</title></circle><text x="226.0" y="197.5" text-anchor="middle"> <tspan class="p">70</tspan></text><circle class="dot" cx="262.0" cy="119.9" r="4"><title>CHoCH 82</title></circle><text x="262.0" y="110.9" text-anchor="middle">CHoCH <tspan class="p">82</tspan></text><circle class="dot" cx="298.0" cy="158.9" r="4"><title> 74</title></circle><text x="298.0" y="177.9" text-anchor="middle"> <tspan class="p">74</tspan></text><circle class="dot" cx="334.0" cy="61.3" r="4"><title>MSB 94</title></circle><text x="334.0" y="52.3" text-anchor="middle">MSB <tspan class="p">94</tspan></text></svg><div class="prices">100 → 78 → 90 → 66 → 76 → 70 → 82 → 74 → 94</div><p class="note">Sözlük: CHoCH iki swing arasında, son büyük tepe kırılmadan olan iç dönüş. LTF'de MSB olan şey HTF'de yalnız CHoCH olabilir.</p></figure><figure class="card"><h3>Premium / discount / EQ (MB-04)</h3><svg viewBox="0 0 380 230" role="img" aria-label="60 100 60 95 68 88"><line class="dashg" x1="6" x2="374" y1="32.0" y2="32.0"/><text class="gl" x="374" y="28.0" text-anchor="end">RH</text><line class="dash" x1="6" x2="374" y1="115.0" y2="115.0"/><text class="lim" x="374" y="111.0" text-anchor="end">EQ: işlem yok</text><line class="dashg" x1="6" x2="374" y1="198.0" y2="198.0"/><text class="gl" x="374" y="194.0" text-anchor="end">RL</text><line class="m" x1="46.0" y1="198.0" x2="103.6" y2="32.0"/><line class="c" x1="103.6" y1="32.0" x2="161.2" y2="198.0"/><line class="m" x1="161.2" y1="198.0" x2="218.8" y2="52.8"/><line class="c" x1="218.8" y1="52.8" x2="276.4" y2="164.8"/><line class="m" x1="276.4" y1="164.8" x2="334.0" y2="81.8"/><circle class="dot" cx="46.0" cy="198.0" r="4"><title> 60</title></circle><text x="46.0" y="217.0" text-anchor="middle"> <tspan class="p">60</tspan></text><circle class="dot" cx="103.6" cy="32.0" r="4"><title>RH 100</title></circle><text x="103.6" y="23.0" text-anchor="middle">RH <tspan class="p">100</tspan></text><circle class="dot" cx="161.2" cy="198.0" r="4"><title>RL 60</title></circle><text x="161.2" y="217.0" text-anchor="middle">RL <tspan class="p">60</tspan></text><circle class="dot" cx="218.8" cy="52.8" r="4"><title>short aranır 95</title></circle><text x="218.8" y="43.8" text-anchor="middle">short aranır <tspan class="p">95</tspan></text><circle class="dot" cx="276.4" cy="164.8" r="4"><title>long aranır 68</title></circle><text x="276.4" y="183.8" text-anchor="middle">long aranır <tspan class="p">68</tspan></text><circle class="dot" cx="334.0" cy="81.8" r="4"><title>EQ'da kâr 88</title></circle><text x="334.0" y="72.8" text-anchor="middle">EQ'da kâr <tspan class="p">88</tspan></text></svg><div class="prices">60 → 100 → 60 → 95 → 68 → 88</div><p class="note">EQ üstü pahalı yarı (short), altı ucuz yarı (long). EQ giriş yeri değil, kâr alma yeri.</p></figure><figure class="card"><h3>EXT bandı: süpürme ve gerçek kırılım (MB-20)</h3><svg viewBox="0 0 380 230" role="img" aria-label="62 80 70 83 74 79 86 88"><line class="dashg" x1="6" x2="374" y1="83.1" y2="83.1"/><text class="gl" x="374" y="79.1" text-anchor="end">tepe</text><line class="dash" x1="6" x2="374" y1="68.4" y2="68.4"/><text class="lim" x="374" y="64.4" text-anchor="end">1,114</text><line class="dash" x1="6" x2="374" y1="55.6" y2="55.6"/><text class="lim" x="374" y="51.6" text-anchor="end">1,214</text><line class="m" x1="46.0" y1="198.0" x2="87.1" y2="83.1"/><line class="c" x1="87.1" y1="83.1" x2="128.3" y2="146.9"/><line class="m" x1="128.3" y1="146.9" x2="169.4" y2="63.9"/><line class="c" x1="169.4" y1="63.9" x2="210.6" y2="121.4"/><line class="m" x1="210.6" y1="121.4" x2="251.7" y2="89.5"/><line class="c" x1="251.7" y1="89.5" x2="292.9" y2="44.8"/><line class="m" x1="292.9" y1="44.8" x2="334.0" y2="32.0"/><circle class="dot" cx="46.0" cy="198.0" r="4"><title> 62</title></circle><text x="46.0" y="217.0" text-anchor="middle"> <tspan class="p">62</tspan></text><circle class="dot" cx="87.1" cy="83.1" r="4"><title>tepe 80</title></circle><text x="87.1" y="74.1" text-anchor="middle">tepe <tspan class="p">80</tspan></text><circle class="dot" cx="12
