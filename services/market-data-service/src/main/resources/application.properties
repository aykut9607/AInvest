server.port=8082
spring.application.name=market-data-service

# external FX provider: Frankfurter (European Central Bank reference rates), free, no API key
market-data.fx.base-url=https://api.frankfurter.dev/v1
# timeout: give up on one call after these limits (they surface as ResourceAccessException, which is retried)
market-data.fx.connect-timeout=2s
market-data.fx.read-timeout=3s

# retry: up to 3 attempts in total, waiting 300 ms, then 600 ms (exponential backoff), only for transient errors:
# network/timeout problems and 5xx answers. A 4xx (bad request to the provider) is not retried.
# CallNotPermittedException (circuit open) is ignored, so an open circuit fails at once instead of being retried.
resilience4j.retry.instances.fxRates.max-attempts=3
resilience4j.retry.instances.fxRates.wait-duration=300ms
resilience4j.retry.instances.fxRates.enable-exponential-backoff=true
resilience4j.retry.instances.fxRates.exponential-backoff-multiplier=2
resilience4j.retry.instances.fxRates.retry-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException
resilience4j.retry.instances.fxRates.ignore-exceptions=io.github.resilience4j.circuitbreaker.CallNotPermittedException

# circuit breaker: looks at the last 10 calls; once at least 5 were made and half of them failed it opens,
# rejects every call for 15 s, then lets 1 trial call through (half-open) to decide whether to close again
resilience4j.circuitbreaker.instances.fxRates.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.fxRates.sliding-window-size=10
resilience4j.circuitbreaker.instances.fxRates.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.fxRates.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.fxRates.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.fxRates.permitted-number-of-calls-in-half-open-state=1
resilience4j.circuitbreaker.instances.fxRates.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.fxRates.record-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException
resilience4j.circuitbreaker.instances.fxRates.register-health-indicator=true

# health shows the breaker state (CLOSED / OPEN / HALF_OPEN); circuitbreakers lists the details
management.endpoints.web.exposure.include=health,circuitbreakers
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
